<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Coleção · @@NOME@@</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<!-- estilos: o carregador põe base.css e a folha do modelo (modelos.json "estilos") -->
</helmet>
<div class="{{modeloCls}}" style="{{vars}}" data-tela="colecao" data-topo="{{lay.topo}}" data-aviso="{{lay.aviso}}" data-cartao="{{lay.cartao}}" data-rodape="{{lay.rodape}}" data-titulos="{{lay.titulos}}" data-faixa="{{lay.faixa}}" data-filtros="{{lay.filtros}}">

<!--TOPO-->

<main id="topo">
<section class="faixa" aria-labelledby="col-t">
<img class="faixa-img" src="{{fotoFaixa}}" alt="">
<div class="wrap faixa-in">
<ol class="migalha"><li><a href="Main.dc.html">Início</a></li><li>Coleção</li></ol>
<h1 id="col-t" class="disp">{{titulo}}</h1>
<p>{{subtitulo}}</p>
</div>
</section>

<div class="wrap">
<div class="chips" role="group" aria-label="Categorias">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="7">
<button class="{{c.cls}}" type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.nome}} <span>{{c.qtd}}</span></button>
</sc-for>
</div>

<div class="corpo">
<aside class="{{filtrosCls}}" aria-label="Filtros">
<div class="bloco">
<h2>Preço</h2>
<ul class="lista">
<sc-for list="{{faixas}}" as="f" hint-placeholder-count="4">
<li><button class="{{f.cls}}" type="button" aria-pressed="{{f.on}}" onClick="{{f.pick}}"><span class="radio"><i aria-hidden="true"></i>{{f.nome}}</span></button></li>
</sc-for>
</ul>
</div>
<div class="bloco">
<h2>Cor</h2>
<div class="amostras">
<sc-for list="{{cores}}" as="k" hint-placeholder-count="8">
<button class="{{k.cls}}" type="button" aria-label="Cor {{k.nome}}" aria-pressed="{{k.on}}" title="{{k.nome}}" style="background: {{k.hex}}" onClick="{{k.pick}}"></button>
</sc-for>
</div>
</div>
<div class="bloco">
<h2>Tamanho</h2>
<div class="tams">
<sc-for list="{{tams}}" as="t" hint-placeholder-count="5">
<button class="{{t.cls}}" type="button" aria-pressed="{{t.on}}" onClick="{{t.pick}}">{{t.nome}}</button>
</sc-for>
</div>
<sc-if value="{{temFiltro}}" hint-placeholder-val="{{false}}"><button class="limpar" type="button" onClick="{{limpar}}">Limpar filtros</button></sc-if>
</div>
</aside>

<div class="principal">
<div class="barra">
<button class="filtrar" type="button" aria-expanded="{{filtrosAbertos}}" onClick="{{abrirFiltros}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>Filtrar</button>
<p>Mostrando <b>{{total}}</b></p>
<div class="barra-dir">
<button class="{{c3}}" type="button" aria-label="Três colunas" aria-pressed="{{eh3}}" onClick="{{por3}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16 4h4v16h-4z"></path></svg></button>
<button class="{{c4}}" type="button" aria-label="Quatro colunas" aria-pressed="{{eh4}}" onClick="{{por4}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h3v16H3zM8 4h3v16H8zM13 4h3v16h-3zM18 4h3v16h-3z"></path></svg></button>
<label class="sr" for="ordem">Ordenar</label>
<select class="ordem" id="ordem" onChange="{{ordenar}}">
<sc-for list="{{ordens}}" as="o" hint-placeholder-count="3">
<option value="{{o.id}}" selected="{{o.on}}">{{o.nome}}</option>
</sc-for>
</select>
</div>
</div>

<sc-if value="{{vazioP}}" hint-placeholder-val="{{false}}">
<div class="vazio"><p>{{vazioTxt}}</p><sc-if value="{{temFiltro}}" hint-placeholder-val="{{false}}"><button class="btn" type="button" onClick="{{limpar}}">Ver todas as peças</button></sc-if></div>
</sc-if>

<div class="{{gradeCls}}">
<sc-for list="{{produtos}}" as="p" hint-placeholder-count="12">
<!--CARD-->
</sc-for>
</div>
</div>
</div>
</div>
</main>

<!--RODAPE-->
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"itens":{"editor":null},"cor":{"editor":null},"links":{"editor":null},"modelo":{"editor":null}}'>
class Component extends DCLogic {
  renderVals() { return window.PrebuildKit.telaColecao(this, { nome: '@@NOME@@', whats: '@@WHATS@@', ig: '@@IG@@' }); }
}
</script>
</body>
</html>
