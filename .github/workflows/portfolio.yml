# Portfólio e telas do site: fotografa o Provador com a loja de exemplo Lua Fit Moda (modo demonstração),
# grava as telas em assets/img/painel/ (galeria "O painel por dentro" do site) e monta o PDF em assets/portfolio/.
# Roda quando algo muda em tools/portfolio/, todo dia 1º (o PDF leva o mês no rodapé) e pelo botão "Run workflow".
name: Portfólio e telas

on:
  push:
    branches: [main]
    paths:
      - 'tools/portfolio/**'
  schedule:
    - cron: '23 9 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: portfolio
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Navegador do robô (Playwright + Chromium)
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Telas do painel e portfólio em PDF
        run: |
          python3 -m http.server 8813 >/dev/null 2>&1 &
          sleep 2
          node tools/portfolio/telas.js
          node tools/portfolio/deck.js

      - name: Gravar na main
        id: gravar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/img/painel assets/portfolio
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git commit -m "Portfólio e telas do painel gerados pelo workflow"
          git pull --rebase origin main
          git push
          echo "mudou=1" >> "$GITHUB_OUTPUT"

      - name: Atualizar o GitHub Pages
        if: steps.gravar.outputs.mudou == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "O Pages atualiza no próximo commit."
